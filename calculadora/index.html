<html>

<head>
    <link rel="stylesheet" href="./styles.css">
    <title> The Calculator </title>
</head>

<body>
    <h2>TESTE Calculadora CSS</h2>
        <div> 
            <button class="button" onclick="changeColor()"> aperte me</button>
        </div>
    <div class="base"> 
        <div class="screen"> 
            <div class="operation"> </div>
        </div>
        <div class="grid">
            <button class = "button">
                <div class="numbers">C</div>
            </button>
            <button class = "button">
                <div class="numbers">CE</div>
            </button>
            <button class = "button">
                <div class="numbers">%</div>
            </button>
            <button class = "button">
                <div class="numbers">+</div>
            </button>
        </div>
        <div class="grid">
            <button class = "button">
                <div class="numbers">1</div>
            </button>
            <button class = "button">
                <div class="numbers">2</div>
            </button>
            <button class = "button">
                <div class="numbers">3</div>
            </button>
            <button class = "button">
                <div class="numbers">-</div>
            </button>
        </div>
        <div class="grid">
            <button class = "button">
                <div class="numbers">4</div>
            </button>
            <button class = "button">
                <div class="numbers">5</div>
            </button>
            <button class = "button">
                <div class="numbers">6</div>
            </button>
            <button class = "button">
                <div class="numbers">x</div>
            </button>
        </div>
        <div class="grid">
            <button class = "button">
                <div class="numbers">7</div>
            </button>
            <button class = "button">
                <div class="numbers">8</div>
            </button>
            <button class = "button">
                <div class="numbers">9</div>
            </button>
            <button class = "button">
                <div class="numbers">÷</div>
            </button>
        </div>
        <div class="grid">
            <button class = "button">
                <div class="numbers">+/-</div>
            </button>
            <button class = "button">
                <div class="numbers">0</div>
            </button>
            <button class = "button">
                <div class="numbers">,</div>
            </button>
            <button class = "button">
                <div class="numbers">=</div>
            </button>
        </div>        
    </div>
</body>
<script src="./script.js"></script>
</html>
